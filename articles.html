    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Articles - Fighter Hasmathullah</title>

    <!-- SEO & Social Meta Tags -->
    <meta name="description" content="Read martial arts guides, fitness tips, and professional articles by Fighter Hasmathullah.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://hasmath1998.github.io/articles.html">
    
    <meta property="og:title" content="Articles - Fighter Hasmathullah">
    <meta property="og:description" content="Read martial arts guides, fitness tips, and professional articles by Fighter Hasmathullah.">

    <style>
        :root {
            --bg-primary: #07090e;
            --bg-secondary: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding-bottom: 75px;
        }

        .site-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 16px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            cursor: pointer;
            text-decoration: none;
        }

        .site-logo {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent);
        }

        .site-title {
            font-size: 11pt;
            font-weight: 700;
            color: var(--text-main);
        }

        .site-title span { color: var(--accent); }

        /* கேட்டகிரி ஃபில்டர் பட்டன்களுக்கான ஸ்டைல் */
        .category-filters {
            display: flex;
            gap: 8px;
            padding: 12px;
            max-width: 600px;
            margin: 0 auto;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
        }
        .category-filters::-webkit-scrollbar { display: none; }

        .filter-btn {
            background: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 8.5pt;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
            font-weight: 600;
        }

        .articles-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 12px 12px 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .article-card {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
            cursor: pointer;
            padding: 12px;
            transition: background 0.2s;
        }

        .article-card:active {
            background: #273548;
        }

        .article-title {
            font-size: 10.5pt;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 6px;
            line-height: 1.4;
        }

        .article-meta {
            font-size: 8pt;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        .footer-policy {
            text-align: center;
            padding: 20px 16px;
            font-size: 8pt;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            margin-top: 20px;
            background: var(--bg-secondary);
        }
        .footer-policy a { color: var(--text-muted); text-decoration: none; margin: 0 5px; }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--bg-secondary);
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            border-top: 1px solid var(--border);
            z-index: 1000;
        }
        .nav-item {
            text-align: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 8pt;
            font-weight: 500;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .nav-item.active { color: var(--accent); }
    </style>
</head>
<body>

    <a href="index.html" class="site-header">
        <img src="image/site-logo.png" alt="Logo" class="site-logo">
        <div class="site-title">Fighter <span>Hasmathullah</span></div>
    </a>

    <!-- கேட்டகிரி பட்டன்கள் -->
    <div class="category-filters" id="category-filters">
        <button class="filter-btn active" onclick="filterArticles('All', this)">All</button>
    </div>

    <div class="articles-container" id="articles-list">
        <p style="text-align:center; color:var(--text-muted); padding:20px;">கட்டுரைகள் ஏற்றப்படுகின்றன...</p>
    </div>

    <div class="footer-policy">
        <a href="about.html">About</a> | <a href="contact.html">Contact</a> | <a href="privacy.html">Privacy Policy</a> | <a href="terms.html">Terms</a> | <a href="disclaimer.html">Disclaimer</a>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><span>🏠</span> Home</a>
        <a href="shorts.html" class="nav-item"><span>⚡</span> Shorts</a>
        <a href="videos.html" class="nav-item"><span>▶️</span> Videos</a>
        <a href="articles.html" class="nav-item active"><span>📖</span> Articles</a>
    </nav>

    <script>
        let allArticles = [];

        fetch('content.json')
            .then(res => res.json())
            .then(data => {
                allArticles = data.articles || data.posts || [];
                const filtersContainer = document.getElementById('category-filters');
                
                // தனித்த கேட்டகிரிகளை கண்டறிதல்
                const categories = ['All', ...new Set(allArticles.map(a => a.category).filter(Boolean))];
                
                if(categories.length > 1) {
                    filtersContainer.innerHTML = '';
                    categories.forEach((cat, index) => {
                        filtersContainer.innerHTML += `
                            <button class="filter-btn ${index === 0 ? 'active' : ''}" onclick="filterArticles('${cat}', this)">${cat}</button>
                        `;
                    });
                }

                renderArticles(allArticles);
            });

        function renderArticles(articles) {
            const container = document.getElementById('articles-list');
            if(articles.length > 0) {
                container.innerHTML = '';
                articles.forEach(item => {
                    container.innerHTML += `
                        <div class="article-card" onclick="window.location='article-view.html?id=${item.id}'">
                            <div class="article-title">${item.title}</div>
                            <div class="article-meta">
                                <span>${item.category || 'Articles'}</span>
                                <span>${item.time || '1 week ago'}</span>
                            </div>
                        </div>
                    `;
                });
            } else {
                container.innerHTML = "<p style='text-align:center; color:var(--text-muted);'>கட்டுரைகள் எதுவும் இல்லை.</p>";
            }
        }

        function filterArticles(category, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if(category === 'All') {
                renderArticles(allArticles);
            } else {
                const filtered = allArticles.filter(a => a.category === category);
                renderArticles(filtered);
            }
        }
    </script>
</body>
