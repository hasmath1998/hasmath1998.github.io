<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shorts Reels - Fighter Hasmathullah</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #161e2e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --nav-bg: #070a12;
            --border-color: #1e293b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            padding-bottom: 80px; 
        }
        h1 {
            text-align: center;
            color: var(--accent);
            font-size: 18pt;
            margin-bottom: 20px;
        }
        .shorts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
            max-width: 800px;
            margin: 0 auto;
        }
        .short-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .short-card:hover {
            transform: scale(1.03);
        }
        .short-thumb-box {
            position: relative;
            width: 100%;
            padding-top: 177.77%; 
            background: #000;
        }
        .short-thumb {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
        }
        .short-title {
            padding: 10px;
            font-size: 9.5pt;
            color: var(--text-main);
            font-weight: bold;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .reels-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            z-index: 1000;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
        }
        .reel-item {
            width: 100%;
            height: 100vh;
            scroll-snap-align: start;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b0f19;
        }
        .reel-video-container {
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 85vh;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .reel-video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .close-reels-btn {
            position: fixed;
            top: 20px; right: 20px;
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: none;
            font-size: 16pt;
            width: 40px; height: 40px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 1010;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }
        .close-reels-btn:hover {
            background: #ef4444;
        }

        /* மற்ற பக்கங்களைப் போன்ற இயல்பான நேவிகேஷன் பார் */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--nav-bg);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid var(--border-color);
            z-index: 999;
        }
        .nav-item {
            text-align: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 8.5pt;
        }
        .nav-item.active {
            color: var(--accent);
        }
        .nav-item svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <h1>Shorts & Reels</h1>

    <div class="shorts-grid" id="shorts-container">
        <p style="text-align:center; color:#94a3b8;">ஏற்றப்படுகிறது...</p>
    </div>

    <div class="reels-overlay" id="reelsOverlay">
        <button class="close-reels-btn" onclick="closeReelsViewer()">&times;</button>
        <div id="reels-feed-container"></div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <div>Home</div>
        </a>
        <a href="shorts.html" class="nav-item active">
            <svg viewBox="0 0 24 24"><path d="M10 16.5l6-4.5-6-4.5v9zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
            <div>Shorts</div>
        </a>
        <a href="videos.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
            <div>Videos</div>
        </a>
        <a href="articles.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
            <div>Articles</div>
        </a>
    </nav>

    <script>
        let allShortsData = [];

        fetch('content.json')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('shorts-container');
                if(data.shorts && data.shorts.length > 0) {
                    allShortsData = data.shorts;
                    container.innerHTML = '';
                    
                    data.shorts.forEach((short, index) => {
                        container.innerHTML += `
                            <div class="short-card" onclick="openReelsViewer(${index})">
                                <div class="short-thumb-box">
                                    <img src="${short.thumbnail}" class="short-thumb" alt="Short">
                                </div>
                                <div class="short-title">${short.title}</div>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = "<p style='text-align:center; color:#94a3b8;'>ஷார்ட்ஸ் எதுவும் இல்லை.</p>";
                }
            })
            .catch(err => {
                document.getElementById('shorts-container').innerHTML = "<p style='text-align:center; color:#ef4444;'>தரவுகளை ஏற்றுவதில் பிழை.</p>";
            });

        function openReelsViewer(startIndex) {
            const overlay = document.getElementById('reelsOverlay');
            const feedContainer = document.getElementById('reels-feed-container');
            
            let feedHtml = '';
            allShortsData.forEach((short, index) => {
                let autoplay = (index === startIndex) ? "?autoplay=1&loop=1&playlist=" + short.youtubeId : "?autoplay=0&loop=1&playlist=" + short.youtubeId;
                
                feedHtml += `
                    <div class="reel-item" id="reel-${index}">
                        <div class="reel-video-container">
                            <iframe src="https://www.youtube.com/embed/${short.youtubeId}${autoplay}" 
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                allowfullscreen>
                            </iframe>
                        </div>
                    </div>
                `;
            });

            feedContainer.innerHTML = feedHtml;
            overlay.style.display = 'block';

            document.getElementById(`reel-${startIndex}`).scrollIntoView();
        }

        function closeReelsViewer() {
            const overlay = document.getElementById('reelsOverlay');
            const feedContainer = document.getElementById('reels-feed-container');
            
            overlay.style.display = 'none';
            feedContainer.innerHTML = '';
        }
    </script>
</body>
</html>
