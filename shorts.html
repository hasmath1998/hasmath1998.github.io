<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shorts Reels - Fighter Hasmathullah</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #161e2e;
            --text-main: #f8fafc;
            --accent: #38bdf8;
            --border-color: #1e293b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var--bg-color);
            background: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: var(--accent);
            font-size: 18pt;
            margin-bottom: 20px;
        }
        /* செங்குத்து கட்டமைப்பு (Reels Grid) */
        .shorts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
            max-width: 800px;
            margin: 0 auto;
        }
        .short-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var--border-color);
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .short-card:hover {
            transform: scale(1.03);
        }
        .short-thumb-box {
            position: relative;
            width: 100%;
            padding-top: 177.77%; /* 9:16 Ratio */
            background: #000;
        }
        .short-thumb {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
        }
        .short-title {
            padding: 10px;
            font-size: 9.5pt;
            color: var(--text-main);
            font-weight: bold;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* முழுத்திரை ரீல்ஸ் ஸ்க்ரோலிங் வியூ (Full Screen Reel Scroll View) */
        .reels-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            z-index: 1000;
            overflow-y: scroll;
            scroll-snap-type: y mandatory; /* கீழே தள்ளும்போது சரியாக ஒரு ரீல்ஸ் மட்டும் நிக்கும் */
        }
        .reel-item {
            width: 100%;
            height: 100vh;
            scroll-snap-align: start;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b0f19;
        }
        .reel-video-container {
            width: 100%;
            max-width: 400px; /* மொபைல் ரீல்ஸ் அகலம் */
            height: 100%;
            max-height: 85vh;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .reel-video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .close-reels-btn {
            position: fixed;
            top: 20px; right: 20px;
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: none;
            font-size: 16pt;
            width: 40px; height: 40px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 1010;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }
        .close-reels-btn:hover {
            background: #ef4444;
        }
    </style>
</head>
<body>

    <h1>Shorts & Reels</h1>

    <!-- ஷார்ட்ஸ் பட்டியல் -->
    <div class="shorts-grid" id="shorts-container">
        <p style="text-align:center; color:#94a3b8;">ஏற்றப்படுகிறது...</p>
    </div>

    <!-- ஸ்க்ரோல் செய்யும் ரீல்ஸ் முழுத்திரை பகுதி -->
    <div class="reels-overlay" id="reelsOverlay">
        <button class="close-reels-btn" onclick="closeReelsViewer()">&times;</button>
        <div id="reels-feed-container">
            <!-- அனைத்து ஷார்ட்ஸ் வீடியோக்களும் வரிசையாக இங்கே லோட் ஆகும் -->
        </div>
    </div>

    <script>
        let allShortsData = [];

        // content.json லிருந்து தரவுகளை எடுப்பது
        fetch('content.json')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('shorts-container');
                if(data.shorts && data.shorts.length > 0) {
                    allShortsData = data.shorts;
                    container.innerHTML = '';
                    
                    data.shorts.forEach((short, index) => {
                        container.innerHTML += `
                            <div class="short-card" onclick="openReelsViewer(${index})">
                                <div class="short-thumb-box">
                                    <img src="${short.thumbnail}" class="short-thumb" alt="Short">
                                </div>
                                <div class="short-title">${short.title}</div>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = "<p style='text-align:center; color:#94a3b8;'>ஷார்ட்ஸ் எதுவும் இல்லை.</p>";
                }
            });

        // கிளிக் செய்த குறிப்பிட்ட ஷார்ட்ஸிலிருந்து ரீல்ஸ் ஓடத் தொடங்கும்
        function openReelsViewer(startIndex) {
            const overlay = document.getElementById('reelsOverlay');
            const feedContainer = document.getElementById('reels-feed-container');
            
            let feedHtml = '';
            // அனைத்து ஷார்ட்ஸ்களையும் ஒന്നിன் பின் ஒன்றாக ஸ்க்ரோல் செய்யும் வகையில் உருவாக்குவது
            allShortsData.forEach((short, index) => {
                // கிளிக் செய்த வீடியோ மட்டும் உடனே ஒலிக்க (autoplay) செய்யும்
                let autoplay = (index === startIndex) ? "?autoplay=1&loop=1&playlist=" + short.youtubeId : "?autoplay=0&loop=1&playlist=" + short.youtubeId;
                
                feedHtml += `
                    <div class="reel-item" id="reel-${index}">
                        <div class="reel-video-container">
                            <iframe src="https://www.youtube.com/embed/${short.youtubeId}${autoplay}" 
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                allowfullscreen>
                            </iframe>
                        </div>
                    </div>
                `;
            });

            feedContainer.innerHTML = feedHtml;
            overlay.style.display = 'block';

            // பயன கிளிக் செய்த குறிப்பிட்ட ரீல்ஸ் பகுதிக்கு ஸ்க்ரோலை நேராக கொண்டு செல்வது
            document.getElementById(`reel-${startIndex}`).scrollIntoView();
        }

        // ரீல்ஸ் பார்வையை மூடுவது
        function closeReelsViewer() {
            const overlay = document.getElementById('reelsOverlay');
            const feedContainer = document.getElementById('reels-feed-container');
            
            overlay.style.display = 'none';
            feedContainer.innerHTML = ''; // வீடியோக்களை நிறுத்துவதற்காக ஃபைலை காலி செய்வது
        }
    </script>
</body>
</html>
