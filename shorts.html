<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shorts - Fighter Hasmathullah</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #212121;
            --text-main: #f1f1f1;
            --text-muted: #aaa;
            --nav-bg: #0f0f0f;
            --border-color: #272727;
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding-bottom: 70px;
        }

        /* Top Filter Bar */
        .filter-bar {
            display: flex;
            gap: 8px;
            padding: 8px 6px 12px 6px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .filter-bar::-webkit-scrollbar { display: none; }
        
        .filter-chip {
            background: #272727;
            color: var(--text-main);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 8.5pt;
            font-weight: 500;
            cursor: pointer;
            border: none;
            white-space: nowrap;
        }
        .filter-chip.active {
            background: #f1f1f1;
            color: #0f0f0f;
        }

        /* 3-Column Shorts Grid (Exact size as screenshot) */
        .shorts-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3px;
            padding: 0 2px;
        }

        .short-card {
            position: relative;
            aspect-ratio: 9 / 16;
            background: var(--card-bg);
            cursor: pointer;
            overflow: hidden;
            border-radius: 2px;
        }

        .short-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .short-views {
            position: absolute;
            bottom: 6px;
            left: 6px;
            font-size: 7pt;
            color: #fff;
            background: rgba(0, 0, 0, 0.6);
            padding: 2px 5px;
            border-radius: 4px;
            font-weight: bold;
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--nav-bg);
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            border-top: 1px solid var(--border-color);
            z-index: 1000;
        }
        .nav-item {
            text-align: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 8pt;
        }
        .nav-item.active {
            color: #fff;
        }
        .nav-item svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <!-- Filter Bar -->
    <div class="filter-bar">
        <button class="filter-chip active">Latest</button>
        <button class="filter-chip">Popular</button>
        <button class="filter-chip">Oldest</button>
    </div>

    <!-- 3-Column Shorts Grid -->
    <div class="shorts-grid" id="shorts-container">
        <p style="grid-column: 1 / -1; text-align:center; color:var(--text-muted); padding:20px;">ஏற்றப்படுகிறது...</p>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <div>Home</div>
        </a>
        <a href="shorts.html" class="nav-item active">
            <svg viewBox="0 0 24 24"><path d="M10 16.5l6-4.5-6-4.5v9zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
            <div>Shorts</div>
        </a>
        <a href="videos.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
            <div>Videos</div>
        </a>
        <a href="articles.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
            <div>Articles</div>
        </a>
    </nav>

    <script>
        fetch('content.json')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('shorts-container');
                if(data.shorts && data.shorts.length > 0) {
                    container.innerHTML = '';
                    data.shorts.forEach(item => {
                        container.innerHTML += `
                            <div class="short-card" onclick="window.location='short-player.html?id=${item.id}'">
                                <img src="${item.thumbnail}" alt="Short">
                                <div class="short-views">${item.views || '1K'} views</div>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = "<p style='grid-column: 1 / -1; text-align:center; color:var(--text-muted);'>ஷார்ட்ஸ் எதுவும் இல்லை.</p>";
                }
            })
            .catch(err => {
                document.getElementById('shorts-container').innerHTML = "<p style='grid-column: 1 / -1; text-align:center; color:#ef4444;'>பிழை ஏற்பட்டது.</p>";
            });
    </script>
</body>
</html>
