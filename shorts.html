<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shorts - Fighter Hasmathullah</title>
    <style>
        :root {
            --bg-primary: #07090e;
            --bg-secondary: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding-bottom: 75px;
        }

        .site-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 16px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .site-logo {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent);
        }

        .site-title {
            font-size: 11pt;
            font-weight: 700;
            color: var(--text-main);
        }

        .site-title span { color: var(--accent); }

        /* 3-Column Grid Layout */
        .shorts-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            padding: 4px;
            max-width: 600px;
            margin: 0 auto;
        }

        .short-card {
            position: relative;
            aspect-ratio: 9 / 16;
            background: var(--card-bg);
            cursor: pointer;
            overflow: hidden;
            border-radius: 4px;
        }

        .short-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .short-views {
            position: absolute;
            bottom: 6px;
            left: 6px;
            font-size: 7.5pt;
            color: #fff;
            background: rgba(0, 0, 0, 0.65);
            padding: 2px 5px;
            border-radius: 3px;
            backdrop-filter: blur(4px);
        }

        .footer-policy {
            text-align: center;
            padding: 20px 16px;
            font-size: 8pt;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            margin-top: 20px;
            background: var(--bg-secondary);
        }
        .footer-policy a { color: var(--text-muted); text-decoration: none; margin: 0 5px; }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--bg-secondary);
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            border-top: 1px solid var(--border);
            z-index: 1000;
        }
        .nav-item {
            text-align: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 8pt;
            font-weight: 500;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .nav-item.active { color: var(--accent); }
    </style>
</head>
<body>

    <header class="site-header">
        <img src="image/logo.jpg" alt="Logo" class="site-logo">
        <div class="site-title">Fighter <span>Hasmathullah</span></div>
    </header>

    <div class="shorts-grid" id="shorts-container">
        <p style="grid-column: 1 / -1; text-align:center; color:var(--text-muted); padding:30px;">ஷார்ட்ஸ் ஏற்றப்படுகின்றன...</p>
    </div>

    <div class="footer-policy">
        <a href="about.html">About</a> | <a href="contact.html">Contact</a> | <a href="privacy.html">Privacy Policy</a> | <a href="terms.html">Terms</a> | <a href="disclaimer.html">Disclaimer</a>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><span>🏠</span> Home</a>
        <a href="shorts.html" class="nav-item active"><span>⚡</span> Shorts</a>
        <a href="videos.html" class="nav-item"><span>▶️</span> Videos</a>
        <a href="articles.html" class="nav-item"><span>📖</span> Articles</a>
    </nav>

    <script>
        fetch('content.json')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('shorts-container');
                const shorts = data.shorts || [];
                if(shorts.length > 0) {
                    container.innerHTML = '';
                    shorts.forEach(item => {
                        container.innerHTML += `
                            <div class="short-card" onclick="window.location='short-view.html?id=${item.id}'">
                                <img src="${item.thumbnail}" alt="Short">
                                <div class="short-views">▶ ${item.views || '15K'}</div>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = "<p style='grid-column: 1 / -1; text-align:center; color:var(--text-muted);'>ஷார்ட்ஸ் எதுவும் இல்லை.</p>";
                }
            });
    </script>
</body>
</html>
