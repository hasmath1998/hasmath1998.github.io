<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ak Hasmathullah - Home</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --nav-bg: #090d16;
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding-bottom: 70px;
        }
        
        /* Top Header: Profile Photo & Styled Centered Name */
        .profile-header {
            text-align: center;
            padding: 20px 15px;
            background: linear-gradient(to bottom, #1e293b, var(--bg-color));
            border-bottom: 1px solid #334155;
        }
        .profile-pic {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            object-fit: cover;
            margin-bottom: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }
        .profile-name {
            font-size: 13pt;
            font-weight: bold;
            color: #ef4444; /* நீங்கள் விரும்பும் ஸ்டைலிஷ் கலர் (சிவப்பு/பிரைட் நிறம்) */
            letter-spacing: 1px;
            margin: 0;
            text-transform: uppercase;
        }
        
        .section-title {
            font-size: 13pt;
            margin: 20px 15px 10px 15px;
            color: var(--accent);
            font-weight: bold;
        }

        /* Horizontal Scrolling Shorts Section (Youtube/TikTok style) */
        .shorts-container {
            display: flex;
            overflow-x: auto;
            gap: 12px;
            padding: 0 15px;
            scrollbar-width: none;
        }
        .shorts-container::-webkit-scrollbar { display: none; }
        .short-card {
            min-width: 120px;
            height: 200px;
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
            position: relative;
            border: 1px solid #334155;
        }
        .short-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Main Feed (Videos & Articles from JSON) */
        .feed-container {
            padding: 0 15px;
        }
        .feed-card {
            background: var(--card-bg);
            border-radius: 8px;
            margin-bottom: 15px;
            overflow: hidden;
            border: 1px solid #334155;
        }
        .feed-card img {
            width: 100%;
            height: 170px;
            object-fit: cover;
        }
        .feed-content {
            padding: 12px;
        }
        .feed-title {
            font-size: 11pt;
            font-weight: bold;
            margin-bottom: 6px;
        }

        /* Footer / Hidden Menu for AdSense Approval */
        .site-footer {
            text-align: center;
            padding: 20px;
            font-size: 8.5pt;
            color: var(--text-muted);
            border-top: 1px solid #334155;
            margin-top: 30px;
        }
        .site-footer a {
            color: var(--text-muted);
            text-decoration: none;
            margin: 0 8px;
        }

        /* Bottom Navigation Bar (Matched with your screenshot) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--nav-bg);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #1e293b;
            z-index: 1000;
        }
        .nav-item {
            text-align: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 9pt;
        }
        .nav-item.active {
            color: var(--text-main);
        }
        .nav-item svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <!-- Top Header: Circular Logo & Styled Centered Name -->
    <div class="profile-header">
        <!-- உங்களது வட்ட வடிவ லோகோ / போட்டோ இங்கே கொடுக்கப்படும் -->
        <img src="profile.jpg" alt="Fighter Hasmathullah" class="profile-pic">
        <div class="profile-name">Fighter Hasmathullah</div>
    </div>

    <!-- Horizontal Scrolling Shorts Section -->
    <div class="section-title">Shorts</div>
    <div class="shorts-container" id="shorts-feed">
        <!-- content.json மூலமாக ஷார்ட்ஸ் டேட்டா இங்கே ஏற்றப்படும் -->
    </div>

    <!-- Main Home Feed (Videos & Articles) -->
    <div class="section-title">Home Feed</div>
    <div class="feed-container" id="main-feed">
        <!-- content.json மூலமாக போஸ்டர்கள் இங்கே ஏற்றப்படும் -->
    </div>

    <!-- Footer Menu (AdSense Approval-க்காக சிறியதாக வைக்கப்பட்டுள்ளது) -->
    <div class="site-footer">
        <p>&copy; 2026 Ak Hasmathullah. All Rights Reserved.</p>
        <div>
            <a href="about.html">About</a> | 
            <a href="privacy.html">Privacy Policy</a> | 
            <a href="contact.html">Contact</a>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <div>Home</div>
        </a>
        <a href="shorts.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M10 16.5l6-4.5-6-4.5v9zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
            <div>Shorts</div>
        </a>
        <a href="videos.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
            <div>Videos</div>
        </a>
        <a href="articles.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
            <div>Articles</div>
        </a>
    </nav>

    <script>
        // content.json கோப்பில் இருந்து டேட்டாவை எடுத்து முகப்பில் காட்டுவதற்கான ஜாவாஸ்கிரிப்ட்
        fetch('content.json')
            .then(response => response.json())
            .then(data => {
                // Shorts Load
                const shortsContainer = document.getElementById('shorts-feed');
                data.shorts.forEach(item => {
                    shortsContainer.innerHTML += `
                        <div class="short-card" onclick="window.location='short-player.html?id=${item.id}'">
                            <img src="${item.thumbnail}" alt="Short">
                        </div>
                    `;
                });

                // Main Feed Load (Videos & Articles)
                const mainFeed = document.getElementById('main-feed');
                data.posts.forEach(item => {
                    mainFeed.innerHTML += `
                        <div class="feed-card" onclick="window.location='${item.type}-view.html?id=${item.id}'">
                            <img src="${item.thumbnail}" alt="Thumbnail">
                            <div class="feed-content">
                                <div class="feed-title">${item.title}</div>
                            </div>
                        </div>
                    `;
                });
            });
    </script>
</body>
</html>
