<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fighter Hasmathullah - Creator Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #0f0f0f;
            color: #ffffff;
            padding-bottom: 70px;
        }

        header {
            background-color: #212121;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #383838;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 1.2rem;
            color: #ff0000;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 15px;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .category-tabs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .category-tabs button {
            background-color: #272727;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.9rem;
        }

        .category-tabs button.active {
            background-color: #ffffff;
            color: #000000;
        }

        .card {
            background-color: #1f1f1f;
            margin-bottom: 20px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #272727;
        }

        .media-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background-color: #000;
        }

        .media-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .card-content {
            padding: 12px 15px;
        }

        .card-title {
            font-size: 1rem;
            margin-bottom: 6px;
            color: #f1f1f1;
            font-weight: bold;
        }

        .card-desc {
            font-size: 0.85rem;
            color: #aaa;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #121212;
            border-top: 1px solid #272727;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }

        .nav-item {
            text-align: center;
            color: #aaa;
            text-decoration: none;
            font-size: 0.75rem;
            cursor: pointer;
            flex: 1;
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
            margin-bottom: 2px;
        }

        .nav-item.active {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <header>
        <h1>Fighter Hasmathullah</h1>
    </header>

    <div class="container">
        <!-- HOME PAGE -->
        <div id="home-page" class="page active">
            <h2>Home Feed</h2>
            <div id="home-feed"></div>
        </div>

        <!-- SHORTS PAGE -->
        <div id="shorts-page" class="page">
            <h2>Shorts</h2>
            <div id="shorts-feed"></div>
        </div>

        <!-- VIDEOS PAGE (பிளேலிஸ்ட் வகைகள் இங்கு கிளிக் செய்த பிறகு மட்டுமே தெரியும்) -->
        <div id="videos-page" class="page">
            <h2>Full Videos</h2>
            <div class="category-tabs">
                <button class="cat-btn active" onclick="filterVideos('all', event)">All</button>
                <button class="cat-btn" onclick="filterVideos('martial-arts', event)">Martial Arts & Conditioning</button>
                <button class="cat-btn" onclick="filterVideos('fitness', event)">Fitness & Weight Loss</button>
                <button class="cat-btn" onclick="filterVideos('korean', event)">Korean Language</button>
            </div>
            <div id="videos-feed"></div>
        </div>

        <!-- ARTICLES PAGE -->
        <div id="articles-page" class="page">
            <h2>Articles</h2>
            <div id="articles-feed"></div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a class="nav-item active" onclick="switchPage('home', this)">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <div>Home</div>
        </a>
        <a class="nav-item" onclick="switchPage('shorts', this)">
            <svg viewBox="0 0 24 24"><path d="M17.77 10.32l-1.2-.5L18 9.06c1.84-.96 2.53-3.23 1.56-5.07s-3.23-2.53-5.07-1.56l-10 5.22c-1.37.72-2.12 2.26-1.87 3.79.25 1.53 1.45 2.74 2.99 2.97l1.2.18-1.47 1.25c-1.6 1.37-1.82 3.73-.49 5.35 1.34 1.63 3.75 1.83 5.33.43l10-8.9c1.07-.95 1.48-2.43 1.05-3.79z"/></svg>
            <div>Shorts</div>
        </a>
        <a class="nav-item" onclick="switchPage('videos', this)">
            <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0-2-.9-2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14zM8 15l6-5-6-5v10z"/></svg>
            <div>Videos</div>
        </a>
        <a class="nav-item" onclick="switchPage('articles', this)">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
            <div>Articles</div>
        </a>
    </nav>

    <script>
        const postsData = [
            { type: 'video', category: 'martial-arts', title: 'இரும்பு உடல் கண்டிஷனிங் செய்வது எப்படி?', desc: 'Iron Body Conditioning tutorial and physical training methods.', embed: 'https://www.youtube.com/embed/dQw4w9WgXcQ' },
            { type: 'short', category: 'martial-arts', title: 'Fast Kick Short', desc: 'Quick martial arts short training.', embed: 'https://www.youtube.com/embed/dQw4w9WgXcQ' },
            { type: 'article', category: 'korean', title: 'கொரிய மொழி அடிப்படை விதிகள்', desc: 'Essential EPS-TOPIK Korean vocabulary and grammar rules.', link: '#' }
        ];

        function renderFeeds() {
            let homeHtml = '';
            let shortsHtml = '';
            let videosHtml = '';
            let articlesHtml = '';

            postsData.forEach(post => {
                let cardHTML = `
                    <div class="card">
                        ${post.type !== 'article' ? `<div class="media-container"><iframe src="${post.embed}" allowfullscreen></iframe></div>` : ''}
                        <div class="card-content">
                            <div class="card-title">${post.title}</div>
                            <div class="card-desc">${post.desc}</div>
                        </div>
                    </div>
                `;
                homeHtml += cardHTML;
                if (post.type === 'short') shortsHtml += cardHTML;
                if (post.type === 'video') videosHtml += cardHTML;
                if (post.type === 'article') articlesHtml += cardHTML;
            });

            document.getElementById('home-feed').innerHTML = homeHtml;
            document.getElementById('shorts-feed').innerHTML = shortsHtml;
            document.getElementById('videos-feed').innerHTML = videosHtml;
            document.getElementById('articles-feed').innerHTML = articlesHtml;
        }

        function switchPage(pageName, element) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(pageName + '-page').classList.add('active');
            element.classList.add('active');
        }

        function filterVideos(category, event) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            let filteredHtml = '';
            postsData.filter(p => p.type === 'video').forEach(post => {
                if (category === 'all' || post.category === category) {
                    filteredHtml += `
                        <div class="card">
                            <div class="media-container"><iframe src="${post.embed}" allowfullscreen></iframe></div>
                            <div class="card-content">
                                <div class="card-title">${post.title}</div>
                                <div class="card-desc">${post.desc}</div>
                            </div>
                        </div>
                    `;
                }
            });
            document.getElementById('videos-feed').innerHTML = filteredHtml;
        }

        window.onload = renderFeeds;
    </script>
</body>
</html>
