    <style>
        :root {
            --bg-primary: #07090e;
            --bg-secondary: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.15);
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding-bottom: 75px;
            -webkit-font-smoothing: antialiased;
        }

        .site-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 16px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(8px);
        }

        .site-logo {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .site-title {
            font-size: 11pt;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        .site-title span {
            color: var(--accent);
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
        }

        .section-header {
            font-size: 11pt;
            font-weight: 600;
            color: var(--accent);
            margin: 20px 0 12px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .feed-card {
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border);
            margin-bottom: 16px;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .feed-card:active {
            transform: scale(0.98);
        }

        .feed-thumb-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
        }

        .feed-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .feed-details {
            padding: 12px;
        }

        .feed-title {
            font-size: 10.5pt;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.4;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .feed-meta {
            font-size: 8.5pt;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        /* YouTube Style Horizontal Scrolling Shorts Shelf */
        .shorts-shelf-container {
            margin: 20px 0;
            background: rgba(15, 23, 42, 0.6);
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            padding: 12px 0;
        }

        .shorts-shelf-title {
            font-size: 11pt;
            font-weight: 600;
            color: var(--accent);
            margin: 0 16px 10px 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .shorts-scroll-row {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 0 16px 8px 16px;
            scrollbar-width: none;
        }

        .shorts-scroll-row::-webkit-scrollbar {
            display: none;
        }

        .short-card-item {
            min-width: 125px;
            width: 125px;
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }

        .short-thumb {
            width: 100%;
            aspect-ratio: 9 / 16;
            object-fit: cover;
            background: #000;
        }

        /* தலைப்பு மறைவதைத் தடுத்து முழுமையாகத் தெரியும்படியான அமைப்பு */
        .short-title {
            font-size: 8pt;
            font-weight: 600;
            color: var(--text-main);
            padding: 8px 6px;
            height: 42px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.2;
        }

        /* Direct Instant Popup Modal for Shorts */
        #shorts-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100vh - 55px);
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .shorts-modal-content {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .shorts-close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-size: 16pt;
            cursor: pointer;
            z-index: 2010;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .shorts-player-container {
            width: 100%;
            height: 100%;
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
        }

        .shorts-player-container::-webkit-scrollbar {
            display: none;
        }

        .short-slide-item {
            min-width: 100%;
            height: 100%;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            background: #000;
        }

        .short-slide-item iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .footer-policy {
            text-align: center;
            padding: 24px 16px;
            font-size: 8pt;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            margin-top: 20px;
            background: var(--bg-secondary);
        }

        .footer-policy a {
            color: var(--text-muted);
            text-decoration: none;
            margin: 0 6px;
            transition: color 0.2s;
        }

        .footer-policy a:hover {
            color: var(--accent);
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--bg-secondary);
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            border-top: 1px solid var(--border);
            z-index: 2500;
            backdrop-filter: blur(10px);
        }

        .nav-item {
            text-align: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 8pt;
            font-weight: 500;
            display: flex;
            flex-direction: column;
            gap: 3px;
            transition: color 0.2s;
        }

        .nav-item.active {
            color: var(--accent);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="section-header">Posts</div>
        <div id="home-feed-container">
            <p style="text-align:center; color:var(--text-muted); padding:20px;">Wait...</p>
        </div>
    </div>

    <!-- Direct Instant Shorts Popup Modal -->
    <div id="shorts-modal">
        <div class="shorts-modal-content">
            <button class="shorts-close-btn" onclick="closeShortsModal()">&times;</button>
            <div class="shorts-player-container" id="shorts-slider-wrapper">
                <!-- Shorts slides will be injected here dynamically -->
            </div>
        </div>
    </div>

    <div class="footer-policy">
        <p style="margin-bottom: 8px;">&copy; 2026 Fighter Hasmathullah. All rights reserved.</p>
        <a href="about.html">About</a> |

        <a href="privacy.html">Privacy Policy</a> | 
        <a href="terms.html">Terms</a> | 
        <a href="disclaimer.html">Disclaimer</a>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active">
            <span>🏠</span> Home
        </a>
        <a href="shorts.html" class="nav-item">
            <span>⚡</span> Shorts
        </a>
        <a href="videos.html" class="nav-item">
            <span>▶️</span> Videos
        </a>
        <a href="articles.html" class="nav-item">
            <span>📖</span> Articles
        </a>
    </nav>

    <script>
        let globalShorts = [];

        fetch('content.json')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('home-feed-container');
                const videos = data.videos || [];
                globalShorts = data.shorts || [];
                const articles = data.articles || [];

                container.innerHTML = '';

                let displayCount = Math.min(2, videos.length);
                for (let i = 0; i < displayCount; i++) {
                    let item = videos[i];
                    container.innerHTML += `
                        <div class="feed-card" onclick="window.location='video-view.html?id=${item.id}'">
                            <div class="feed-thumb-container">
                                <img src="${item.thumbnail}" class="feed-thumb" alt="Thumbnail">
                            </div>
                            <div class="feed-details">
                                <div class="feed-title">${item.title}</div>
                                <div class="feed-meta">
                                    <span>${item.category || 'Martial Arts'}</span>
                                    <span>1K views</span>
                                </div>
                            </div>
                        </div>
                    `;
                }

                if (globalShorts.length > 0) {
                    let shortsHtml = `
                        <div class="shorts-shelf-container">
                            <div class="shorts-shelf-title">⚡ Shorts</div>
                            <div class="shorts-scroll-row">
                    `;
                    globalShorts.forEach((short) => {
                        shortsHtml += `
                            <div class="short-card-item" onclick="openShortsModal('${short.id}')">
                                <img src="${short.thumbnail}" class="short-thumb" alt="Short">
                                <div class="short-title">${short.title}</div>
                            </div>
                        `;
                    });
                    shortsHtml += `</div></div>`;
                    container.innerHTML += shortsHtml;
                }

                let remainingVideos = videos.slice(displayCount);
                let maxLength = Math.max(remainingVideos.length, articles.length);

                for (let i = 0; i < maxLength; i++) {
                    if (remainingVideos[i]) {
                        let item = remainingVideos[i];
                        container.innerHTML += `
                            <div class="feed-card" onclick="window.location='video-view.html?id=${item.id}'">
                                <div class="feed-thumb-container">
                                    <img src="${item.thumbnail}" class="feed-thumb" alt="Thumbnail">
                                </div>
                                <div class="feed-details">
                                    <div class="feed-title">${item.title}</div>
                                    <div class="feed-meta">
                                        <span>${item.category || 'Martial Arts'}</span>
                                        <span>1K views</span>
                                    </div>
                                </div>
                            </div>
                        `;
                    }
                    if (articles[i]) {
                        let art = articles[i];
                        container.innerHTML += `
                            <div class="feed-card" onclick="window.location='article-view.html?id=${art.id}'">
                                <div class="feed-thumb-container">
                                    <img src="${art.thumbnail}" class="feed-thumb" alt="Thumbnail">
                                </div>
                                <div class="feed-details">
                                    <div class="feed-title">${art.title}</div>
                                    <div class="feed-meta">
                                        <span>📖 Article</span>
                                        <span>Read</span>
                                    </div>
                                </div>
                            </div>
                        `;
                    }
                }

                if (videos.length === 0 && globalShorts.length === 0 && articles.length === 0) {
                    container.innerHTML = "<p style='text-align:center; color:var(--text-muted);'>Posts Not Available.</p>";
                }
            })
            .catch(err => {
                document.getElementById('home-feed-container').innerHTML = "<p style='text-align:center; color:#ef4444;'>.Connection Error.</p>";
            });

        // youtubeId ஐப் பயன்படுத்தி பாப்-அப் வீடியோவை சரியாக பிளே செய்தல்
        function openShortsModal(shortId) {
            const modal = document.getElementById('shorts-modal');
            const sliderWrapper = document.getElementById('shorts-slider-wrapper');
            
            sliderWrapper.innerHTML = '';
            
            globalShorts.forEach(short => {
                let ytEmbedUrl = '';
                if (short.youtubeId) {
                    ytEmbedUrl = `https://www.youtube.com/embed/${short.youtubeId}?autoplay=1&mute=0&loop=1&playlist=${short.youtubeId}`;
                }

                sliderWrapper.innerHTML += `
                    <div class="short-slide-item" id="slide-${short.id}">
                        <iframe src="${ytEmbedUrl}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                    </div>
                `;
            });

            modal.style.display = 'flex';

            setTimeout(() => {
                const targetSlide = document.getElementById(`slide-${shortId}`);
                if (targetSlide) {
                    targetSlide.scrollIntoView({ behavior: 'auto', inline: 'start' });
                }
            }, 50);
        }

        function closeShortsModal() {
            const modal = document.getElementById('shorts-modal');
            const sliderWrapper = document.getElementById('shorts-slider-wrapper');
            modal.style.display = 'none';
            sliderWrapper.innerHTML = ''; 
        }
    </script>
