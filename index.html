<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fighter Hasmathullah - Official Hub</title>
    <style>
        :root {
            --bg-primary: #07090e;
            --bg-secondary: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.15);
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding-bottom: 75px;
            -webkit-font-smoothing: antialiased;
        }

        /* Professional Header */
        .site-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 16px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(8px);
        }

        .site-logo {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .site-title {
            font-size: 11pt;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        .site-title span {
            color: var(--accent);
        }

        /* Main Container */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
        }

        .section-header {
            font-size: 11pt;
            font-weight: 600;
            color: var(--accent);
            margin: 20px 0 12px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Home Feed Cards */
        .feed-card {
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border);
            margin-bottom: 16px;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .feed-card:active {
            transform: scale(0.98);
        }

        .feed-thumb-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
        }

        .feed-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .feed-details {
            padding: 12px;
        }

        .feed-title {
            font-size: 10.5pt;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.4;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .feed-meta {
            font-size: 8.5pt;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        /* Footer & AdSense Links */
        .footer-policy {
            text-align: center;
            padding: 24px 16px;
            font-size: 8pt;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            margin-top: 20px;
            background: var(--bg-secondary);
        }

        .footer-policy a {
            color: var(--text-muted);
            text-decoration: none;
            margin: 0 6px;
            transition: color 0.2s;
        }

        .footer-policy a:hover {
            color: var(--accent);
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--bg-secondary);
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            border-top: 1px solid var(--border);
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .nav-item {
            text-align: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 8pt;
            font-weight: 500;
            display: flex;
            flex-direction: column;
            gap: 3px;
            transition: color 0.2s;
        }

        .nav-item.active {
            color: var(--accent);
        }
    </style>
</head>
<body>

    <!-- Professional Header -->
    <header class="site-header">
        <img src="image/logo.jpg" alt="Logo" class="site-logo">
        <div class="site-title">Fighter <span>Hasmathullah</span></div>
    </header>

    <div class="container">
        <div class="section-header">🔥 Featured Content</div>
        <div id="home-feed-container">
            <p style="text-align:center; color:var(--text-muted); padding:20px;">ஏற்றப்படுகிறது...</p>
        </div>
    </div>

    <!-- Footer Policy Links for AdSense Approval -->
    <div class="footer-policy">
        <p style="margin-bottom: 8px;">&copy; 2026 Fighter Hasmathullah. All rights reserved.</p>
        <a href="about.html">About</a> | 
        <a href="contact.html">Contact</a> | 
        <a href="privacy.html">Privacy Policy</a> | 
        <a href="terms.html">Terms</a> | 
        <a href="disclaimer.html">Disclaimer</a>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active">
            <span>🏠</span> Home
        </a>
        <a href="shorts.html" class="nav-item">
            <span>⚡</span> Shorts
        </a>
        <a href="videos.html" class="nav-item">
            <span>▶️</span> Videos
        </a>
        <a href="articles.html" class="nav-item">
            <span>📖</span> Articles
        </a>
    </nav>

    <script>
        fetch('content.json')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('home-feed-container');
                const posts = data.posts || [];
                if(posts.length > 0) {
                    container.innerHTML = '';
                    posts.forEach(item => {
                        container.innerHTML += `
                            <div class="feed-card" onclick="window.location='video-view.html?id=${item.id}'">
                                <div class="feed-thumb-container">
                                    <img src="${item.thumbnail}" class="feed-thumb" alt="Thumbnail">
                                </div>
                                <div class="feed-details">
                                    <div class="feed-title">${item.title}</div>
                                    <div class="feed-meta">
                                        <span>${item.category || 'Martial Arts'}</span>
                                        <span>${item.views || '1K'} views</span>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = "<p style='text-align:center; color:var(--text-muted);'>பதிவுகள் எதுவும் இல்லை.</p>";
                }
            })
            .catch(err => {
                document.getElementById('home-feed-container').innerHTML = "<p style='text-align:center; color:#ef4444;'>தரவுகளை ஏற்றுவதில் பிழை.</p>";
            });
    </script>
</body>
</html>
