<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fighter Hasmathullah</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #161e2e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --border-color: #1e293b;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding-bottom: 70px;
        }
        /* Header Style */
        .site-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 12px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }
        .site-logo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent);
        }
        .site-title {
            font-size: 11pt;
            font-weight: bold;
            color: var(--accent);
            letter-spacing: 0.5px;
        }
        /* Content Feed */
        .container { padding: 12px; max-width: 600px; margin: 0 auto; }
        .section-title { font-size: 11pt; font-weight: bold; margin: 15px 0 8px 0; color: var(--accent); }
        
        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #070a12;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid var(--border-color);
            z-index: 1000;
        }
        .nav-item {
            text-align: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 8.5pt;
        }
        .nav-item.active {
            color: var(--accent);
        }
        /* Footer Links for AdSense */
        .footer-links {
            text-align: center;
            padding: 20px 0;
            font-size: 8pt;
            color: var(--text-muted);
        }
        .footer-links a { color: var(--text-muted); text-decoration: none; margin: 0 5px; }
    </style>
</head>
<body>

    <!-- Header with Logo and Name -->
    header class="site-header">
        <img src="image/logo.jpg" alt="Logo" class="site-logo">
        <div class="site-title">Fighter Hasmathullah</div>
    </header>

    <div class="container" id="home-feed">
        <div class="section-title">Latest Videos & Posts</div>
        <div id="posts-container">ஏற்றப்படுகிறது...</div>
    </div>

    <!-- Footer Links (AdSense Approval Required Pages) -->
    <div class="footer-links">
        <a href="about.html">About</a> | 
        <a href="contact.html">Contact</a> | 
        <a href="privacy.html">Privacy Policy</a> | 
        <a href="terms.html">Terms</a> | 
        <a href="disclaimer.html">Disclaimer</a>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active">Home</a>
        <a href="shorts.html" class="nav-item">Shorts</a>
        <a href="videos.html" class="nav-item">Videos</a>
        <a href="articles.html" class="nav-item">Articles</a>
    </nav>

    <script>
        fetch('content.json')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('posts-container');
                if(data.posts && data.posts.length > 0) {
                    container.innerHTML = '';
                    data.posts.forEach(item => {
                        container.innerHTML += `
                            <div style="background:var(--card-bg); padding:8px; border-radius:6px; margin-bottom:10px; cursor:pointer;" onclick="window.location='video-view.html?id=${item.id}'">
                                <img src="${item.thumbnail}" style="width:100%; height:160px; object-fit:cover; border-radius:4px;">
                                <div style="font-weight:bold; font-size:10pt; margin-top:6px;">${item.title}</div>
                            </div>
                        `;
                    });
                }
            });
    </script>
</body>
</html>
