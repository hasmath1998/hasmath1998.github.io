<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch - Fighter Hasmathullah</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #0f0f0f; color: #ffffff; padding-bottom: 30px; }
        header { background-color: #212121; padding: 15px 20px; border-bottom: 1px solid #383838; }
        header h1 { font-size: 1.1rem; color: #ff0000; cursor: pointer; }
        .container { max-width: 800px; margin: 0 auto; padding: 15px; }
        .player-container { position: relative; width: 100%; padding-bottom: 56.25%; background-color: #000; margin-bottom: 15px; }
        .player-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .video-info h2 { font-size: 1.2rem; margin-bottom: 8px; color: #fff; }
        .video-info p { color: #aaa; font-size: 0.9rem; margin-bottom: 20px; }
        .related-title { font-size: 1rem; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .related-card { display: flex; gap: 10px; background: #1f1f1f; padding: 10px; border-radius: 8px; margin-bottom: 10px; cursor: pointer; }
        .related-card div { font-size: 0.9rem; color: #f1f1f1; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1 onclick="window.location.href='videos.html'">← Back to Videos</h1>
    </header>

    <div class="container">
        <div class="player-container">
            <iframe id="main-video" src="" allowfullscreen></iframe>
        </div>
        <div class="video-info">
            <h2 id="video-title">Loading...</h2>
            <p id="video-desc"></p>
        </div>

        <div class="related-section">
            <div class="related-title">Related Videos</div>
            <div id="related-list"></div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('id');

        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                const currentVideo = data.videos.find(v => v.id === videoId) || data.videos[0];
                
                document.getElementById('main-video').src = currentVideo.embed;
                document.getElementById('video-title').innerText = currentVideo.title;
                document.getElementById('video-desc').innerText = currentVideo.desc;

                let relatedHtml = '';
                data.videos.forEach(video => {
                    if(video.id !== currentVideo.id) {
                        relatedHtml += `
                            <div class="related-card" onclick="window.location.href='watch.html?id=${video.id}'">
                                <div>${video.title}</div>
                            </div>
                        `;
                    }
                });
                document.getElementById('related-list').innerHTML = relatedHtml;
            });
    </script>
</body>
</html>
