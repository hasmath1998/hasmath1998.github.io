<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article - Fighter Hasmathullah</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #161e2e;
            --text-main: #f8fafc;
            --accent: #38bdf8;
            --border-color: #1e293b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px 16px;
            line-height: 1.8;
        }
        .main-container {
            max-width: 750px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }
        .back-btn {
            display: inline-block;
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: bold;
            text-decoration: none;
            margin-bottom: 20px;
            font-size: 9pt;
        }
        .back-btn:hover {
            background: var(--accent);
            color: var(--bg-color);
        }
        .article-title {
            font-size: 16pt;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 15px;
        }
        .article-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }
        .article-body {
            font-size: 10.5pt;
            color: #cbd5e1;
            text-align: justify;
        }
        .article-body p {
            margin-bottom: 16px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <a href="articles.html" class="back-btn">← Back to Articles</a>

        <div id="article-container">
            <p>கட்டுரை ஏற்றப்படுகிறது...</p>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const articleId = urlParams.get('id');

        fetch('content.json')
            .then(res => res.json())
            .then(data => {
                const post = data.articles.find(p => p.id == articleId);
                
                if(post) {
                    document.getElementById('article-container').innerHTML = `
                        <h1 class="article-title">${post.title}</h1>
                        <img src="${post.thumbnail}" class="article-img" alt="Cover">
                        <div class="article-body" id="external-content">உள்ளடக்கம் ஏற்றப்படுகிறது...</div>
                    `;

                    if(post.file) {
                        fetch(post.file)
                            .then(res => res.text())
                            .then(htmlContent => {
                                document.getElementById('external-content').innerHTML = htmlContent;
                            })
                            .catch(err => {
                                document.getElementById('external-content').innerHTML = "<p style='color:red;'>கட்டுரை கோப்பை ஏற்றுவதில் பிழை.</p>";
                            });
                    }
                } else {
                    document.getElementById('article-container').innerHTML = "<p style='color:red;'>கட்டுரை கிடைக்கவில்லை.</p>";
                }
            });
    </script>
</body>
</html>
