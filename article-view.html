<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article - Fighter Hasmathullah</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #161e2e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --border-color: #1e293b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px 16px;
            line-height: 1.8;
        }
        .main-container {
            max-width: 750px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }
        .back-btn {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
            font-size: 9pt;
            display: inline-flex;
            align-items: center;
            text-decoration: none;
        }
        .back-btn:hover {
            background: var(--accent);
            color: var(--bg-color);
        }
        /* இங்கு தனித்தனியாக இணைக்கப்படும் கட்டுரையின் ஸ்டைல் பொதுவானதாகக் காட்டும் */
        .article-title {
            font-size: 16pt;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 15px;
        }
        .article-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }
        .article-body {
            font-size: 10.5pt;
            color: #cbd5e1;
            text-align: justify;
        }
        .article-body p {
            margin-bottom: 16px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- பின்னோக்கிச் செல்ல -->
        <a href="articles.html" class="back-btn">← Back to Articles</a>

        <div id="article-container">
            <!-- JSON மற்றும் தனி HTML கோப்பு இங்கு லோட் ஆகும் -->
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');

        fetch('content.json')
            .then(res => res.json())
            .then(data => {
                const post = data.articles.find(p => p.id == postId);
                if(post) {
                    // JSON-ல் உள்ள தலைப்பு மற்றும் படத்தை முதலில் போடுகிறோம்
                    let htmlContent = `
                        <h1 class="article-title">${post.title}</h1>
                        <img src="${post.thumbnail}" class="article-img" alt="Article Cover">
                        <div class="article-body" id="external-content">மற்றும் தகவல்கள் ஏற்றப்படுகின்றன...</div>
                    `;
                    document.getElementById('article-container').innerHTML = htmlContent;

                    // இப்போது நீங்கள் தனித்தனியாக எழுதியுள்ள HTML கோப்பை (எ.கா: article-1.html) உள்ளே கொண்டு வருகிறோம்
                    if(post.file) {
                        fetch(post.file)
                            .then(res => res.text())
                            .then(pageHtml => {
                                document.getElementById('external-content').innerHTML = pageHtml;
                            })
                            .catch(err => {
                                document.getElementById('external-content').innerHTML = '<p style="color:red;">கட்டுரை உள்ளடக்கத்தை ஏற்றுவதில் பிழை.</p>';
                            });
                    }
                } else {
                    document.getElementById('article-container').innerHTML = `<p style="color:red;">கட்டுரை கிடைக்கவில்லை.</p>`;
                }
            });
    </script>
</body>
</html>
