<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article - Fighter Hasmathullah</title>
    <style>
        body { 
            background: #0b0f19; 
            color: #f8fafc; 
            padding: 20px; 
            font-family: 'Segoe UI', sans-serif; 
            line-height: 1.8;
            max-width: 750px;
            margin: 0 auto;
        }
        .back-btn { 
            display: inline-block;
            background: #38bdf8; 
            color: #0b0f19; 
            padding: 8px 15px; 
            border-radius: 5px; 
            font-weight: bold; 
            text-decoration: none; 
            margin-bottom: 20px; 
        }
        .article-title { 
            font-size: 16pt; 
            font-weight: bold; 
            color: #38bdf8; 
            margin-bottom: 15px; 
        }
        .article-img { 
            width: 100%; 
            height: 250px; 
            object-fit: cover; 
            border-radius: 8px; 
            margin-bottom: 20px; 
        }
        .article-body { 
            font-size: 11pt; 
            color: #cbd5e1; 
            text-align: justify; 
        }
    </style>
</head>
<body>

    <a href="articles.html" class="back-btn">← Back</a>

    <div id="article-container">
        <p>Loading...</p>
    </div>

    <script>
        // URL-ல் உள்ள ?id=1 மதிப்பை எடுக்கும்
        const urlParams = new URLSearchParams(window.location.search);
        const articleId = urlParams.get('id');

        // content.json கோப்பிலிருந்து தகவலைப் பெறும்
        fetch('content.json')
            .then(res => res.json())
            .then(data => {
                const post = data.articles.find(p => p.id == articleId);
                
                if(post) {
                    // தலைப்பு மற்றும் படத்தை முதலில் காண்பிக்கும்
                    document.getElementById('article-container').innerHTML = `
                        <h1 class="article-title">${post.title}</h1>
                        <img src="${post.thumbnail}" class="article-img" alt="Cover">
                        <div class="article-body" id="external-content">கட்டுரை ஏற்றப்படுகிறது...</div>
                    `;

                    // நீங்கள் எழுதிய தனி HTML கோப்பை (எ.கா: article-1.html) உள்ளே கொண்டு வரும்
                    if(post.file) {
                        fetch(post.file)
                            .then(res => res.text())
                            .then(htmlContent => {
                                document.getElementById('external-content').innerHTML = htmlContent;
                            })
                            .catch(err => {
                                document.getElementById('external-content').innerHTML = "<p style='color:red;'>கட்டுரை கோப்பை ஏற்றுவதில் பிழை.</p>";
                            });
                    }
                } else {
                    document.getElementById('article-container').innerHTML = "<p style='color:red;'>கட்டுரை கிடைக்கவில்லை.</p>";
                }
            });
    </script>
</body>
</html>
