<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article - Fighter Hasmathullah</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0b0f19; color: #f8fafc; margin: 0; padding: 20px; line-height: 1.7; }
        .article-title { font-size: 15pt; font-weight: bold; color: #38bdf8; margin-bottom: 15px; }
        .article-img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; margin-bottom: 15px; }
        .article-body { font-size: 11pt; color: #cbd5e1; text-align: justify; }
        .back-btn { background: #38bdf8; color: #0b0f19; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; margin-bottom: 15px; }
    </style>
</head>
<body>
    <button class="back-btn" onclick="history.back()">← Back</button>
    <div id="article-container">
        <!-- JS மூலம் ஆர்டிக்கிள் விவரங்கள் இங்கே வரும் -->
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');

        fetch('content.json')
            .then(res => res.json())
            .then(data => {
                const post = data.posts.find(p => p.id == postId);
                if(post) {
                    document.getElementById('article-container').innerHTML = `
                        <div class="article-title">${post.title}</div>
                        <img src="${post.thumbnail}" class="article-img" alt="Article Image">
                        <div class="article-body">${post.content || 'இங்கு கட்டுரையின் முழுமையான விவரங்கள் இடம்பெறும்...'}</div>
                    `;
                }
            });
    </script>
</body>
</html>
