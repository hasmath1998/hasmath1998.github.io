<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player - Fighter Hasmathullah</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0b0f19; color: #f8fafc; margin: 0; padding: 15px; }
        .video-box { width: 100%; height: 210px; background: #000; border-radius: 8px; margin-bottom: 15px; }
        .video-title { font-size: 13pt; font-weight: bold; margin-bottom: 10px; }
        .back-btn { background: #38bdf8; color: #0b0f19; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; margin-bottom: 15px; }
    </style>
</head>
<body>
    <button class="back-btn" onclick="history.back()">← Back</button>
    <div id="player-container">
        <!-- JS மூலம் வீடியோ விவரங்கள் இங்கே வரும் -->
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');

        fetch('content.json')
            .then(res => res.json())
            .then(data => {
                const post = data.posts.find(p => p.id == postId);
                if(post) {
                    document.getElementById('player-container').innerHTML = `
                        <div class="video-box">
                            <iframe width="100%" height="100%" src="https://www.youtube.com/embed/${post.youtubeId || 'xxxxxx'}" frameborder="0" allowfullscreen></iframe>
                        </div>
                        <div class="video-title">${post.title}</div>
                        <p style="color: #94a3b8; font-size: 10pt;"> श्रेणी / Category: ${post.category || 'General'}</p>
                    `;
                }
            });
    </script>
</body>
</html>
