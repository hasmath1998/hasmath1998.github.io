        if (currentVideoId) {

        } else {

        }
        document.head.appendChild(dynamicVideoCanonical);

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('id');

        fetch('content.json')
            .then(res => res.json())
            .then(data => {
                const videos = data.videos || [];
                const shorts = data.shorts || [];
                const allItems = [...videos, ...shorts];
                const item = allItems.find(p => p.id == videoId);
                
                const playerBox = document.getElementById('media-player-box');
                const infoBox = document.getElementById('video-info-box');
                const relatedContainer = document.getElementById('related-videos-container');

                if(item) {
                    // SEO மற்றும் சமூக வலைத்தள மேட்டா டேக்குகளை டைனமிக்காக மாற்றுதல்
                    const pageTitle = `${item.title} - Fighter Hasmathullah`;
                    const pageDesc = item.description ? item.description : "Watch martial arts tutorials and training videos on Fighter Hasmathullah.";
                    const pageUrl = window.location.href;
                    const pageImage = item.thumbnail ? item.thumbnail : "https://hasmath1998.github.io/image/site-logo.png";

                    document.getElementById('page-title').innerText = pageTitle;
                    document.getElementById('meta-description').setAttribute('content', pageDesc);
                    
                    document.getElementById('meta-og-title').setAttribute('content', pageTitle);
                    document.getElementById('meta-og-desc').setAttribute('content', pageDesc);
                    document.getElementById('meta-og-url').setAttribute('content', pageUrl);
                    document.getElementById('meta-og-image').setAttribute('content', pageImage);

                    document.getElementById('meta-twitter-title').setAttribute('content', pageTitle);
                    document.getElementById('meta-twitter-desc').setAttribute('content', pageDesc);
                    document.getElementById('meta-twitter-image').setAttribute('content', pageImage);

                    // பிளேயர் மற்றும் விவரங்களை அமைத்தல் (யூடியூப் போன்ற சரியான அளவு மற்றும் மறைப்புகளைத் தவிர்க்க rel=0, playsinline=1 சேர்க்கப்பட்டுள்ளது)
                    playerBox.innerHTML = `<iframe src="https://www.youtube.com/embed/${item.youtubeId}?autoplay=1&rel=0&playsinline=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
                    
                    const descriptionText = item.description ? item.description : "No description available for this video.";
                    
                    infoBox.innerHTML = `
                        <div class="video-title">${item.title}</div>
                        <div class="video-meta">${item.category || 'Martial Arts'} • Recently</div>
                        
                        <div class="action-buttons">
                            <button class="action-btn" id="like-btn" onclick="toggleLike()">
                                <span id="like-icon">👍</span> <span id="like-text">Like</span> (<span id="like-count">142</span>)
                            </button>
                            <button class="action-btn" onclick="shareVideo()">
                                <span>↗</span> Share
                            </button>
                        </div>

                        <div class="video-desc-box">
                            <div class="video-desc" id="desc-text">${descriptionText}</div>
                            <button class="desc-toggle-btn" id="desc-btn" onclick="toggleDescription()">...more</button>
                        </div>

                        <div class="comments-section" id="comments-section-box">
                            <div class="comments-header-row">
                                <div class="comments-title">Comments</div>
                                <button class="minimize-btn" id="minimize-btn" onclick="toggleMinimizeComments()">▲ Hide</button>
                            </div>
                            
                            <div class="comments-content-wrap" id="comments-content-wrap">
                                <div class="comment-preview-box" onclick="openCommentsModal()">
                                    <div id="preview-text"><b>Viewer:</b> Great tutorial, very helpful! 🔥</div>
                                    <span style="font-size: 7.5pt; color: var(--accent);">View all</span>
                                </div>
                            </div>
                        </div>

                        <div class="comments-modal" id="commentsModal">
                            <div class="comments-modal-content">
                                <div class="modal-header">
                                    <span>Comments (<span id="total-comments-count">2</span>)</span>
                                    <button class="close-modal-btn" onclick="closeCommentsModal()">&times;</button>
                                </div>
                                
                                <div class="comment-input-box">
                                    <input type="text" id="modal-comment-input" class="comment-input" placeholder="Add a comment...">
                                    <button class="comment-submit-btn" onclick="addComment()">Post</button>
                                </div>

                                <div class="modal-comments-list" id="modal-comments-list"></div>
                            </div>
                        </div>
                    `;

                    // கேட்டகரி அடிப்படையில் தொடர்புடைய வீடியோக்களை வரிசைப்படுத்துதல்
                    const otherItems = allItems.filter(p => p.id != videoId);
                    const sameCategoryItems = otherItems.filter(p => p.category && item.category && p.category.toLowerCase() === item.category.toLowerCase());
                    const otherCategoryItems = otherItems.filter(p => !p.category || !item.category || p.category.toLowerCase() !== item.category.toLowerCase());
                    const sortedRelatedItems = [...sameCategoryItems, ...otherCategoryItems];

                    if(sortedRelatedItems.length > 0) {
                        relatedContainer.innerHTML = '';
                        sortedRelatedItems.forEach(oth => {
                            relatedContainer.innerHTML += `
                                <div class="related-item" onclick="window.location='video-view.html?id=${oth.id}'">
                                    <div class="related-thumb-container">
                                        <img src="${oth.thumbnail}" class="related-thumb" alt="Thumbnail">
                                    </div>
                                    <div class="related-details">
                                        <div class="related-title">${oth.title}</div>
                                    </div>
                                </div>
                            `;
                        });
                    } else {
                        relatedContainer.innerHTML = "<p style='font-size:8.5pt; color:var(--text-muted); grid-column: span 3;'>No Related Videos.</p>";
                    }

                } else {
                    playerBox.innerHTML = `<p style="color:#ef4444; font-size:9pt;">Video Not Found.</p>`;
                }
            });

        let isLiked = false;
        let baseLikes = 142;
        function toggleLike() {
            const btn = document.getElementById('like-btn');
            const icon = document.getElementById('like-icon');
            const text = document.getElementById('like-text');
            const countSpan = document.getElementById('like-count');
            
            isLiked = !isLiked;
            if(isLiked) {
                btn.classList.add('liked');
                icon.innerText = "❤️";
                text.innerText = "Liked";
                countSpan.innerText = baseLikes + 1;
            } else {
                btn.classList.remove('liked');
                icon.innerText = "👍";
                text.innerText = "Like";
                countSpan.innerText = baseLikes;
            }
        }

        let commentsData = [
            { id: 1, author: "Viewer", text: "Great tutorial, very helpful! 🔥" },
            { id: 2, author: "Fighter", text: "Thank you! Keep practicing. 💪" }
        ];

        function openCommentsModal() {
            document.getElementById('commentsModal').classList.add('active');
            renderComments();
        }
        function closeCommentsModal() {
            document.getElementById('commentsModal').classList.remove('active');
        }

        function toggleMinimizeComments() {
            const wrap = document.getElementById('comments-content-wrap');
            const btn = document.getElementById('minimize-btn');
            if(wrap.classList.contains('minimized')) {
                wrap.classList.remove('minimized');
                btn.innerText = "▲ Hide";
            } else {
                wrap.classList.add('minimized');
                btn.innerText = "▼ Show";
            }
        }

        function renderComments() {
            const listEl = document.getElementById('modal-comments-list');
            const previewEl = document.getElementById('preview-text');
            const countEl = document.getElementById('total-comments-count');
            
            countEl.innerText = commentsData.length;

            if(commentsData.length > 0) {
                const latest = commentsData[commentsData.length - 1];
                previewEl.innerHTML = `<b>${latest.author}:</b> ${latest.text}`;
                
                listEl.innerHTML = '';
                commentsData.forEach((c, index) => {
                    let actionButtons = '';
                    if (c.author === "You") {
                        actionButtons = `
                            <div class="comment-actions">
                                <button class="comment-action-btn" onclick="editComment(${index})">Edit</button>
                                <button class="comment-action-btn" style="color:#ef4444;" onclick="deleteComment(${index})">Delete</button>
                            </div>
                        `;
                    }

                    listEl.innerHTML += `
                        <div class="modal-comment-item">
                            <div style="flex-grow:1; margin-right:8px;">
                                <b>${c.author}:</b> <span>${c.text}</span>
                            </div>
                            ${actionButtons}
                        </div>
                    `;
                });
            } else {
                previewEl.innerHTML = `<i>No comments yet. Be the first to comment!</i>`;
                listEl.innerHTML = `<p style='font-size:8.5pt; color:var(--text-muted); text-align:center;'>No comments available.</p>`;
            }
        }

        function addComment() {
            const input = document.getElementById('modal-comment-input');
            if(input.value.trim() !== "") {
                commentsData.push({ id: Date.now(), author: "You", text: input.value.trim() });
                input.value = "";
                renderComments();
            }
        }

        function editComment(index) {
            const currentText = commentsData[index].text;
            const newText = prompt("Edit your comment:", currentText);
            if(newText !== null && newText.trim() !== "") {
                commentsData.[span_0](start_span)[span_0](end_span)index.text = newText.trim();
                renderComments();
            }
        }

        function deleteComment(index) {
            if(confirm("Are you sure you want to delete this comment?")) {
                commentsData.commentsData?.splice(index, 1);
                renderComments();
            }
        }

        function shareVideo() {
            if (navigator.share) {
                navigator.share({
                    title: document.title,
                    url: window.location.href
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert("Link copied to clipboard!");
            }
        }

        function toggleDescription() {
            const desc = document.getElementById('desc-text');
            const btn = document.getElementById('desc-btn');
            if(desc.classList.contains('expanded')) {
                desc.classList.remove('expanded');
                btn.innerText = "...more";
            } else {
                desc.classList.add('expanded');
                btn.innerText = "Show less";
            }
        }
