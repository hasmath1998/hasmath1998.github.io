<!DOCTYPE html>
<html lang="ta">
<head>

    <link rel="icon" type="image/png" href="image/site-logo.png">
<link rel="shortcut icon" type="image/png" href="image/site-logo.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch - Fighter Hasmathullah</title>
    <style>
        :root {
            --bg-primary: #07090e;
            --bg-secondary: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding-bottom: 75px;
        }

        .site-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 16px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .site-logo {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent);
        }

        .site-title {
            font-size: 11pt;
            font-weight: 700;
            color: var(--text-main);
        }

        .site-title span { color: var(--accent); }

        .view-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 12px;
        }

        .media-box {
            width: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
        }

        .media-box iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-info {
            margin-top: 12px;
            padding: 4px;
        }

        .video-title {
            font-size: 11pt;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .video-meta {
            font-size: 8.5pt;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .related-section-title {
            font-size: 10pt;
            font-weight: 600;
            color: var(--accent);
            margin: 20px 0 10px 0;
            border-top: 1px solid var(--border);
            padding-top: 12px;
        }

        .related-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .related-item {
            display: flex;
            gap: 8px;
            background: var(--card-bg);
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border);
            cursor: pointer;
            padding: 4px;
        }

        .related-thumb {
            width: 100px;
            min-width: 100px;
            height: 56px;
            object-fit: cover;
            border-radius: 4px;
        }

        .related-details {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .related-title {
            font-size: 8.5pt;
            font-weight: 600;
            color: var(--text-main);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.3;
        }

        .back-btn {
            display: inline-block;
            background: var(--card-bg);
            color: var(--accent);
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 9pt;
            border: 1px solid var(--border);
            margin-top: 16px;
        }

        .footer-policy {
            text-align: center;
            padding: 20px 16px;
            font-size: 8pt;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            margin-top: 20px;
            background: var(--bg-secondary);
        }
        .footer-policy a { color: var(--text-muted); text-decoration: none; margin: 0 5px; }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--bg-secondary);
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            border-top: 1px solid var(--border);
            z-index: 1000;
        }
        .nav-item {
            text-align: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 8pt;
            font-weight: 500;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .nav-item.active { color: var(--accent); }
    </style>
</head>
<body>

    <header class="site-header">
        <img src="image/site-logo.png" alt="Logo" class="site-logo">
        <div class="site-title">Fighter <span>Hasmathullah</span></div>
    </header>

    <div class="view-container">
        <div class="media-box" id="media-player-box">
            <p style="color:var(--text-muted); font-size:9pt;">Please Wait...</p>
        </div>
        <div class="video-info" id="video-info-box"></div>

        <div class="related-section-title">More Videos</div>
        <div class="related-list" id="related-videos-container"></div>

        <a href="index.html" class="back-btn">← Return Home</a>
    </div>

    <div class="footer-policy">
        <a href="about.html">About</a> | <a href="contact.html">Contact</a> | <a href="privacy.html">Privacy Policy</a> | <a href="terms.html">Terms</a> | <a href="disclaimer.html">Disclaimer</a>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><span>🏠</span> Home</a>
        <a href="shorts.html" class="nav-item"><span>⚡</span> Shorts</a>
        <a href="videos.html" class="nav-item"><span>▶️</span> Videos</a>
        <a href="articles.html" class="nav-item"><span>📖</span> Articles</a>
    </nav>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('id');

        fetch('content.json')
            .then(res => res.json())
            .then(data => {
                const videos = data.videos || [];
                const shorts = data.shorts || [];
                const allItems = [...videos, ...shorts];
                const item = allItems.find(p => p.id == videoId);
                
                const playerBox = document.getElementById('media-player-box');
                const infoBox = document.getElementById('video-info-box');
                const relatedContainer = document.getElementById('related-videos-container');

                if(item) {
                    // YouTube Iframe Embed
                    playerBox.innerHTML = `<iframe src="https://www.youtube.com/embed/${item.youtubeId}?autoplay=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
                    
                    infoBox.innerHTML = `
                        <div class="video-title">${item.title}</div>
                        <div class="video-meta">1K views • Recently</div>
                    `;

                    // Render Other Videos Below (YouTube style)
                    const otherItems = allItems.filter(p => p.id != videoId);
                    if(otherItems.length > 0) {
                        relatedContainer.innerHTML = '';
                        otherItems.forEach(oth => {
                            relatedContainer.innerHTML += `
                                <div class="related-item" onclick="window.location='video-view.html?id=${oth.id}'">
                                    <img src="${oth.thumbnail}" class="related-thumb" alt="Thumbnail">
                                    <div class="related-details">
                                        <div class="related-title">${oth.title}</div>
                                    </div>
                                </div>
                            `;
                        });
                    } else {
                        relatedContainer.innerHTML = "<p style='font-size:8.5pt; color:var(--text-muted);'>No Videos.</p>";
                    }

                } else {
                    playerBox.innerHTML = `<p style="color:#ef4444; font-size:9pt;">No Videos.</p>`;
                }
            });
    </script>
</body>
</html>
