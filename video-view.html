    <style>
        :root {
            --bg-primary: #07090e;
            --bg-secondary: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding-bottom: 75px;
        }

        .site-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 16px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            cursor: pointer;
            text-decoration: none;
        }

        .site-logo {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent);
        }

        .site-title {
            font-size: 11pt;
            font-weight: 700;
            color: var(--text-main);
        }

        .site-title span { color: var(--accent); }

        .view-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 12px;
        }

        /* யூடியூப் போல பிளேயர் ஸ்க்ரோல் ஆகாமல் நிலையாக நிற்பதற்கான பகுதி */
        .sticky-player-wrapper {
            position: sticky;
            top: 65px;
            z-index: 99;
            background: var(--bg-primary);
            padding-bottom: 4px;
        }

        .media-box {
            width: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
        }

        /* ஷார்ட்ஸ் வீடியோக்களுக்குரிய செங்குத்து பிளேயர் அளவு */
        .media-box.short-media-box {
            aspect-ratio: 9 / 16;
            max-height: 400px;
            max-width: 230px;
            margin: 0 auto;
        }

        .media-box iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-info {
            margin-top: 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
        }

        .video-title {
            font-size: 11pt;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 6px;
            line-height: 1.4;
        }

        .video-meta {
            font-size: 8.5pt;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        /* YouTube ஸ்டைல் Description (More / Less வசதியுடன்) */
        .video-desc-box {
            font-size: 9pt;
            color: var(--text-muted);
            line-height: 1.4;
            background: var(--card-bg);
            padding: 8px;
            border-radius: 6px;
            margin-top: 6px;
        }

        .video-desc {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-desc.expanded {
            display: block;
        }

        .desc-toggle-btn {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 8.5pt;
            font-weight: 600;
            cursor: pointer;
            margin-top: 4px;
            padding: 0;
        }

        .related-section-title {
            font-size: 10pt;
            font-weight: 600;
            color: var(--accent);
            margin: 20px 0 10px 0;
            border-top: 1px solid var(--border);
            padding-top: 12px;
        }

        /* தொடர்புடைய வீடியோக்களுக்கான கட்டமைப்பு (Grid Layout) */
        .related-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        @media (min-width: 500px) {
            .related-list {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .related-item {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease;
        }

        .related-item:active {
            transform: scale(0.98);
        }

        /* சாதாரண வீடியோக்களுக்குரிய அகலமான থাম்ப்நெயில் வடிவம் (16:9) */
        .related-thumb-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
        }

        /* ஷார்ட்ஸ் வீடியோக்களுக்குரிய செங்குத்தான நீளக் கட்டமைப்பு வடிவம் (9:16) */
        .related-thumb-container.short-thumb-container {
            aspect-ratio: 9 / 16;
            max-height: 220px;
            margin: 0 auto;
        }

        .related-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .related-details {
            padding: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }

        .related-title {
            font-size: 8.5pt;
            font-weight: 600;
            color: var(--text-main);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.3;
        }

        .back-btn {
            display: inline-block;
            background: var(--card-bg);
            color: var(--accent);
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 9pt;
            border: 1px solid var(--border);
            margin-top: 20px;
        }

        .footer-policy {
            text-align: center;
            padding: 20px 16px;
            font-size: 8pt;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            margin-top: 20px;
            background: var(--bg-secondary);
        }
        .footer-policy a { color: var(--text-muted); text-decoration: none; margin: 0 5px; }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--bg-secondary);
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            border-top: 1px solid var(--border);
            z-index: 1000;
        }
        .nav-item {
            text-align: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 8pt;
            font-weight: 500;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .nav-item.active { color: var(--accent); }
    </style>
</head>
<body>

    <div class="view-container">
        <!-- பிளேயர் மேலே நிலைத்து நிற்கும் பகுதி -->
        <div class="sticky-player-wrapper">
            <div class="media-box" id="media-player-box">
                <p style="color:var(--text-muted); font-size:9pt;">Please Wait...</p>
            </div>
        </div>

        <div class="video-info" id="video-info-box"></div>

        <div class="related-section-title">Related Videos</div>
        <div class="related-list" id="related-videos-container"></div>

        <a href="index.html" class="back-btn">← Return Home</a>
    </div>

    <div class="footer-policy">
        <a href="about.html">About</a> | <a href="contact.html">Contact</a> | <a href="privacy.html">Privacy Policy</a> | <a href="terms.html">Terms</a> | <a href="disclaimer.html">Disclaimer</a>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><span>🏠</span> Home</a>
        <a href="shorts.html" class="nav-item"><span>⚡</span> Shorts</a>
        <a href="videos.html" class="nav-item"><span>▶️</span> Videos</a>
        <a href="articles.html" class="nav-item"><span>📖</span> Articles</a>
    </nav>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('id');

        fetch('content.json')
            .then(res => res.json())
            .then(data => {
                const videos = data.videos || [];
                const shorts = data.shorts || [];
                
                const allItems = [...videos, ...shorts];
                const item = allItems.find(p => p.id == videoId);
                
                const playerBox = document.getElementById('media-player-box');
                const infoBox = document.getElementById('video-info-box');
                const relatedContainer = document.getElementById('related-videos-container');

                if(item) {
                    const isCurrentShort = shorts.some(s => s.id == item.id);

                    if(isCurrentShort) {
                        playerBox.classList.add('short-media-box');
                    } else {
                        playerBox.classList.remove('short-media-box');
                    }

                    // YouTube Iframe Embed
                    playerBox.innerHTML = `<iframe src="https://www.youtube.com/embed/${item.youtubeId}?autoplay=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
                    
                    // Description மற்றும் More/Less வசதிக்கான பகுதி
                    const descriptionText = item.description ? item.description : "No description available for this video.";
                    
                    infoBox.innerHTML = `
                        <div class="video-title">${item.title}</div>
                        <div class="video-meta">${item.category || 'Martial Arts'} • Recently</div>
                        <div class="video-desc-box">
                            <div class="video-desc" id="desc-text">${descriptionText}</div>
                            <button class="desc-toggle-btn" id="desc-btn" onclick="toggleDescription()">...more</button>
                        </div>
                    `;

                    // அதே கேட்டகிரி (Category) சார்ந்த வீடியோக்களை முதலில் வரிசைப்படுத்திவிட்டு, மற்றவற்றைப் பின்னால் காட்டுவது
                    const otherItems = allItems.filter(p => p.id != videoId);
                    
                    const sameCategoryItems = otherItems.filter(p => p.category && item.category && p.category.toLowerCase() === item.category.toLowerCase());
                    const otherCategoryItems = otherItems.filter(p => !p.category || !item.category || p.category.toLowerCase() !== item.category.toLowerCase());
                    
                    const sortedRelatedItems = [...sameCategoryItems, ...otherCategoryItems];

                    if(sortedRelatedItems.length > 0) {
                        relatedContainer.innerHTML = '';
                        sortedRelatedItems.forEach(oth => {
                            const isOthShort = shorts.some(s => s.id == oth.id);
                            const thumbContainerClass = isOthShort ? 'related-thumb-container short-thumb-container' : 'related-thumb-container';

                            relatedContainer.innerHTML += `
                                <div class="related-item" onclick="window.location='video-view.html?id=${oth.id}'">
                                    <div class="${thumbContainerClass}">
                                        <img src="${oth.thumbnail}" class="related-thumb" alt="Thumbnail">
                                    </div>
                                    <div class="related-details">
                                        <div class="related-title">${oth.title}</div>
                                    </div>
                                </div>
                            `;
                        });
                    } else {
                        relatedContainer.innerHTML = "<p style='font-size:8.5pt; color:var(--text-muted); grid-column: span 3;'>No Related Videos.</p>";
                    }

                } else {
                    playerBox.innerHTML = `<p style="color:#ef4444; font-size:9pt;">Video Not Found.</p>`;
                }
            });

        // Description விரிவுபடுத்தும் / சுருக்கும் ஜாவாஸ்கிரிப்ட் பங்க்ஷன்
        function toggleDescription() {
            const desc = document.getElementById('desc-text');
            const btn = document.getElementById('desc-btn');
            if(desc.classList.contains('expanded')) {
                desc.classList.remove('expanded');
                btn.innerText = "...more";
            } else {
                desc.classList.add('expanded');
                btn.innerText = "Show less";
            }
        }
    </script>
</body>
