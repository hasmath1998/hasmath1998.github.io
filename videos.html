<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos - Fighter Hasmathullah</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #161e2e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --nav-bg: #070a12;
            --border-color: #1e293b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            padding-bottom: 80px;
        }
        
        /* Top Header */
        .page-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .page-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 14pt;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0;
        }

        /* YouTube Style Video Grid (கச்சிதமான மற்றும் நேர்த்தியான வடிவம்) */
        .videos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .video-card {
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .video-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        .video-thumb-box {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 YouTube Standard Aspect Ratio */
            background: #000;
        }

        .video-thumb {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
        }

        .video-info {
            padding: 12px;
        }

        .video-title {
            font-size: 10pt;
            font-weight: bold;
            color: #f1f5f9;
            margin: 0 0 6px 0;
            display: -webkit-box;
            -webkit-line-clamp: 2; /* இரண்டு வரிகளுக்கு மேல் சென்றால் சுருக்கிவிடும் */
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.4;
        }

        .video-meta {
            font-size: 8.5pt;
            color: var(--text-muted);
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--nav-bg);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid var(--border-color);
            z-index: 1000;
        }
        .nav-item {
            text-align: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 8.5pt;
        }
        .nav-item.active {
            color: var(--accent);
        }
        .nav-item svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <header class="page-header">
        <h1 class="page-title">Videos</h1>
    </header>

    <!-- வீடியோக்கள் பட்டியல் இங்கேயும் லோட் ஆகும் -->
    <div class="videos-grid" id="videos-container">
        <p style="text-align:center; color:var(--text-muted); grid-column: 1 / -1;">ஏற்றப்படுகிறது...</p>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <div>Home</div>
        </a>
        <a href="shorts.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M10 16.5l6-4.5-6-4.5v9zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
            <div>Shorts</div>
        </a>
        <a href="videos.html" class="nav-item active">
            <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
            <div>Videos</i>
        </a>
        <a href="articles.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
            <div>Articles</div>
        </a>
    </nav>

    <script>
        fetch('content.json')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('videos-container');
                
                // content.json-ல் உள்ள posts அல்லது videos பிரிவிலிருந்து வீடியோக்களை வடிகட்டி எடுக்கலாம்
                // இங்கு உதாரணத்திற்கு type 'video' உள்ளவை அல்லது பொதுவான posts எடுக்கப்பட்டுள்ளன
                const videoList = data.posts ? data.posts.filter(item => item.type === 'video' || !item.type) : [];

                if(videoList.length > 0) {
                    container.innerHTML = '';
                    videoList.forEach(item => {
                        container.innerHTML += `
                            <div class="video-card" onclick="window.location='video-view.html?id=${item.id}'">
                                <div class="video-thumb-box">
                                    <img src="${item.thumbnail}" class="video-thumb" alt="Thumbnail">
                                </div>
                                <div class="video-info">
                                    <div class="video-title">${item.title}</div>
                                    <div class="video-meta">Fighter Hasmathullah</div>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = "<p style='text-align:center; color:var(--text-muted); grid-column: 1 / -1;'>வீடியோக்கள் எதுவும் இல்லை.</p>";
                }
            })
            .catch(err => {
                document.getElementById('videos-container').innerHTML = "<p style='text-align:center; color:#ef4444; grid-column: 1 / -1;'>தரவுகளை ஏற்றுவதில் பிழை.</p>";
            });
    </script>
</body>
</html>
