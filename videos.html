<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos - Fighter Hasmathullah</title>
    <style>
        :root {
            --bg-primary: #07090e;
            --bg-secondary: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding-bottom: 75px;
        }

        .site-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 16px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .site-logo {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent);
        }

        .site-title {
            font-size: 11pt;
            font-weight: 700;
            color: var(--text-main);
        }

        .site-title span { color: var(--accent); }

        .videos-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* YouTube List Style Card */
        .video-item-card {
            display: flex;
            gap: 10px;
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
            cursor: pointer;
            padding: 6px;
            transition: background 0.2s;
        }

        .video-item-card:active {
            background: #273548;
        }

        .video-thumb-box {
            position: relative;
            width: 125px;
            min-width: 125px;
            height: 70px;
            background: #000;
            border-radius: 6px;
            overflow: hidden;
        }

        .video-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-details {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex-grow: 1;
        }

        .video-title {
            font-size: 9.5pt;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.3;
        }

        .video-meta {
            font-size: 8pt;
            color: var(--text-muted);
        }

        /* Footer Policy */
        .footer-policy {
            text-align: center;
            padding: 20px 16px;
            font-size: 8pt;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            margin-top: 20px;
            background: var(--bg-secondary);
        }
        .footer-policy a { color: var(--text-muted); text-decoration: none; margin: 0 5px; }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--bg-secondary);
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            border-top: 1px solid var(--border);
            z-index: 1000;
        }
        .nav-item {
            text-align: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 8pt;
            font-weight: 500;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .nav-item.active { color: var(--accent); }
    </style>
</head>
<body>

    <header class="site-header">
        <img src="image/logo.jpg" alt="Logo" class="site-logo">
        <div class="site-title">Fighter <span>Hasmathullah</span></div>
    </header>

    <div class="videos-container" id="videos-list">
        <p style="text-align:center; color:var(--text-muted); padding:20px;">வீடியோக்கள் ஏற்றப்படுகின்றன...</p>
    </div>

    <div class="footer-policy">
        <a href="about.html">About</a> | <a href="contact.html">Contact</a> | <a href="privacy.html">Privacy Policy</a> | <a href="terms.html">Terms</a> | <a href="disclaimer.html">Disclaimer</a>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><span>🏠</span> Home</a>
        <a href="shorts.html" class="nav-item"><span>⚡</span> Shorts</a>
        <a href="videos.html" class="nav-item active"><span>▶️</span> Videos</a>
        <a href="articles.html" class="nav-item"><span>📖</span> Articles</a>
    </nav>

    <script>
        fetch('content.json')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('videos-list');
                const posts = data.posts || [];
                if(posts.length > 0) {
                    container.innerHTML = '';
                    posts.forEach(item => {
                        container.innerHTML += `
                            <div class="video-item-card" onclick="window.location='video-view.html?id=${item.id}'">
                                <div class="video-thumb-box">
                                    <img src="${item.thumbnail}" class="video-thumb" alt="Thumbnail">
                                </div>
                                <div class="video-details">
                                    <div class="video-title">${item.title}</div>
                                    <div class="video-meta">${item.views || '10K'} views • ${item.time || '1 day ago'}</div>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = "<p style='text-align:center; color:var(--text-muted);'>வீடியோக்கள் எதுவும் இல்லை.</p>";
                }
            });
    </script>
</body>
</html>
