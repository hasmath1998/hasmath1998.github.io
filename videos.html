<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos - Fighter Hasmathullah</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #0f0f0f; color: #ffffff; padding-bottom: 70px; }
        header { background-color: #212121; padding: 15px 20px; border-bottom: 1px solid #383838; position: sticky; top: 0; z-index: 100; }
        header h1 { font-size: 1.2rem; color: #ff0000; }
        .container { max-width: 800px; margin: 0 auto; padding: 15px; }
        .card { background-color: #1f1f1f; margin-bottom: 20px; border-radius: 12px; overflow: hidden; border: 1px solid #272727; cursor: pointer; }
        .media-container { position: relative; width: 100%; padding-bottom: 56.25%; background-color: #000; }
        .media-container img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .card-content { padding: 12px 15px; }
        .card-title { font-size: 1rem; margin-bottom: 6px; color: #f1f1f1; font-weight: bold; }
        .card-desc { font-size: 0.85rem; color: #aaa; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background-color: #121212; border-top: 1px solid #272727; display: flex; justify-content: space-around; padding: 10px 0; z-index: 1000; }
        .nav-item { text-align: center; color: #aaa; text-decoration: none; font-size: 0.75rem; flex: 1; }
        .nav-item svg { width: 24px; height: 24px; fill: currentColor; margin: 0 auto 2px auto; display: block; }
        .nav-item.active { color: #ffffff; }
    </style>
</head>
<body>

    <header>
        <h1>Full Videos</h1>
    </header>

    <div class="container" id="video-list">
        <!-- Videos will load dynamically from data.json -->
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            Home
        </a>
        <a href="shorts.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M17.77 10.32l-1.2-.5L18 9.06c1.84-.96 2.53-3.23 1.56-5.07s-3.23-2.53-5.07-1.56l-10 5.22c-1.37.72-2.12 2.26-1.87 3.79.25 1.53 1.45 2.74 2.99 2.97l1.2.18-1.47 1.25c-1.6 1.37-1.82 3.73-.49 5.35 1.34 1.63 3.75 1.83 5.33.43l10-8.9c1.07-.95 1.48-2.43 1.05-3.79z"/></svg>
            Shorts
        </a>
        <a href="videos.html" class="nav-item active">
            <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0-2-.9-2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14zM8 15l6-5-6-5v10z"/></svg>
            Videos
        </a>
        <a href="articles.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
            Articles
        </a>
    </nav>

    <script>
        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                let html = '';
                data.videos.forEach(video => {
                    html += `
                        <div class="card" onclick="window.location.href='watch.html?id=${video.id}'">
                            <div class="media-container">
                                <iframe src="${video.embed}" style="position:absolute; top:0; left:0; width:100%; height:100%; border:none; pointer-events:none;" allowfullscreen></iframe>
                            </div>
                            <div class="card-content">
                                <div class="card-title">${video.title}</div>
                                <div class="card-desc">${video.desc}</div>
                            </div>
                        </div>
                    `;
                });
                document.getElementById('video-list').innerHTML = html;
            });
    </script>
</body>
</html>
